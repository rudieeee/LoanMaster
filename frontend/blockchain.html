<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LoanMaster - Blockchain Explorer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 30px;
        }

        .header h1 {
            color: #667eea;
            font-size: 36px;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 16px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            text-align: center;
        }

        .stat-card h3 {
            font-size: 42px;
            color: #667eea;
            margin-bottom: 10px;
        }

        .stat-card p {
            color: #666;
            font-size: 16px;
        }

        .stat-card.valid {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .stat-card.valid h3,
        .stat-card.valid p {
            color: white;
        }

        .stat-card.invalid {
            background: linear-gradient(135deg, #f93e3e 0%, #d62828 100%);
            color: white;
        }

        .stat-card.invalid h3,
        .stat-card.invalid p {
            color: white;
        }

        .blockchain-container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .blockchain-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .blockchain-header h2 {
            color: #667eea;
            font-size: 28px;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            transition: transform 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .block {
            background: #f8f9fa;
            border: 2px solid #667eea;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
            position: relative;
            transition: all 0.3s;
        }

        .block:hover {
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.3);
            transform: translateY(-2px);
        }

        .block.genesis {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .block.genesis .block-header,
        .block.genesis .block-info,
        .block.genesis .hash-section {
            color: white;
        }

        .block-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #667eea;
        }

        .block.genesis .block-header {
            border-bottom-color: rgba(255,255,255,0.3);
        }

        .block-title {
            font-size: 24px;
            font-weight: bold;
            color: #667eea;
        }

        .block.genesis .block-title {
            color: white;
        }

        .block-badge {
            background: #667eea;
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
        }

        .block.genesis .block-badge {
            background: rgba(255,255,255,0.3);
        }

        .block-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .info-item {
            display: flex;
            flex-direction: column;
        }

        .info-label {
            font-size: 12px;
            color: #999;
            margin-bottom: 5px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .block.genesis .info-label {
            color: rgba(255,255,255,0.7);
        }

        .info-value {
            font-size: 16px;
            color: #333;
            font-weight: 500;
            word-break: break-all;
        }

        .block.genesis .info-value {
            color: white;
        }

        .hash-section {
            background: white;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
        }

        .block.genesis .hash-section {
            background: rgba(255,255,255,0.2);
        }

        .hash-label {
            font-size: 12px;
            color: #999;
            margin-bottom: 5px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .block.genesis .hash-label {
            color: rgba(255,255,255,0.9);
        }

        .hash-value {
            font-family: 'Courier New', monospace;
            font-size: 14px;
            color: #667eea;
            word-break: break-all;
            background: #f8f9fa;
            padding: 10px;
            border-radius: 5px;
        }

        .block.genesis .hash-value {
            background: rgba(255,255,255,0.1);
            color: white;
        }

        .transactions-section {
            margin-top: 20px;
            padding: 15px;
            background: white;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }

        .block.genesis .transactions-section {
            background: rgba(255,255,255,0.2);
            border-left-color: white;
        }

        .transaction-item {
            padding: 12px;
            background: #f8f9fa;
            border-radius: 6px;
            margin-bottom: 10px;
        }

        .block.genesis .transaction-item {
            background: rgba(255,255,255,0.1);
        }

        .transaction-type {
            font-weight: bold;
            color: #667eea;
            margin-bottom: 5px;
        }

        .block.genesis .transaction-type {
            color: white;
        }

        .transaction-detail {
            font-size: 14px;
            color: #666;
            margin: 3px 0;
        }

        .block.genesis .transaction-detail {
            color: rgba(255,255,255,0.9);
        }

        .loading {
            text-align: center;
            padding: 50px;
            font-size: 20px;
            color: #667eea;
        }

        .error {
            background: #f93e3e;
            color: white;
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
        }

        .chain-link {
            text-align: center;
            margin: 15px 0;
            font-size: 24px;
            color: #667eea;
        }

        .back-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: white;
            color: #667eea;
            border: 2px solid #667eea;
            padding: 15px 30px;
            border-radius: 50px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            transition: all 0.3s;
        }

        .back-btn:hover {
            background: #667eea;
            color: white;
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>⛓️ Blockchain Explorer</h1>
            <p>Immutable loan transaction ledger powered by blockchain technology</p>
        </div>

        <div class="stats-grid" id="stats">
            <div class="stat-card">
                <h3 id="totalBlocks">0</h3>
                <p>Total Blocks</p>
            </div>
            <div class="stat-card">
                <h3 id="totalTransactions">0</h3>
                <p>Total Transactions</p>
            </div>
            <div class="stat-card">
                <h3 id="difficulty">0</h3>
                <p>Mining Difficulty</p>
            </div>
            <div class="stat-card" id="validityCard">
                <h3 id="validity">✓</h3>
                <p>Blockchain Valid</p>
            </div>
        </div>

        <div class="blockchain-container">
            <div class="blockchain-header">
                <h2>📦 Blockchain Ledger</h2>
                <button class="btn" onclick="refreshBlockchain()">🔄 Refresh</button>
            </div>
            <div id="blockchainContent">
                <div class="loading">Loading blockchain...</div>
            </div>
        </div>
    </div>

    <button class="back-btn" onclick="window.location.href='/frontend/admin.html'">← Back to Dashboard</button>

    <script>
        let currentChain = [];

        async function loadBlockchainStats() {
            try {
                const response = await fetch('/api/blockchain/stats');
                const stats = await response.json();
                
                document.getElementById('totalBlocks').textContent = stats.total_blocks || 0;
                document.getElementById('totalTransactions').textContent = stats.total_transactions || 0;
                document.getElementById('difficulty').textContent = stats.difficulty || 0;
                
                const validityCard = document.getElementById('validityCard');
                const validityElement = document.getElementById('validity');
                
                if (stats.is_valid) {
                    validityCard.className = 'stat-card valid';
                    validityElement.textContent = '✓';
                } else {
                    validityCard.className = 'stat-card invalid';
                    validityElement.textContent = '✗';
                }
            } catch (error) {
                console.error('Error loading stats:', error);
            }
        }

        async function loadBlockchain() {
            try {
                const response = await fetch('/api/blockchain/chain');
                const data = await response.json();
                currentChain = data.chain;
                
                displayBlockchain(currentChain);
            } catch (error) {
                console.error('Error loading blockchain:', error);
                document.getElementById('blockchainContent').innerHTML = 
                    '<div class="error">Failed to load blockchain. Please try again.</div>';
            }
        }

        function displayBlockchain(chain) {
            const container = document.getElementById('blockchainContent');
            container.innerHTML = '';
            
            // Display blocks in reverse order (newest first)
            for (let i = chain.length - 1; i >= 0; i--) {
                const block = chain[i];
                const blockElement = createBlockElement(block);
                container.appendChild(blockElement);
                
                // Add chain link arrow except for last block
                if (i > 0) {
                    const link = document.createElement('div');
                    link.className = 'chain-link';
                    link.innerHTML = '⬇️';
                    container.appendChild(link);
                }
            }
        }

        function createBlockElement(block) {
            const blockDiv = document.createElement('div');
            blockDiv.className = block.index === 0 ? 'block genesis' : 'block';
            
            let transactionsHTML = '';
            if (block.data.transactions && block.data.transactions.length > 0) {
                transactionsHTML = `
                    <div class="transactions-section">
                        <div class="hash-label">Transactions (${block.data.transactions.length})</div>
                        ${block.data.transactions.map(tx => `
                            <div class="transaction-item">
                                <div class="transaction-type">🔹 ${formatTransactionType(tx.type)}</div>
                                ${formatTransactionDetails(tx)}
                            </div>
                        `).join('')}
                    </div>
                `;
            } else if (block.data.message) {
                transactionsHTML = `
                    <div class="transactions-section">
                        <div class="hash-label">Block Data</div>
                        <div class="transaction-item">
                            <div class="transaction-type">💎 ${block.data.type || 'Genesis'}</div>
                            <div class="transaction-detail">${block.data.message}</div>
                        </div>
                    </div>
                `;
            }
            
            blockDiv.innerHTML = `
                <div class="block-header">
                    <div class="block-title">Block #${block.index}</div>
                    <div class="block-badge">${block.index === 0 ? 'GENESIS' : 'MINED'}</div>
                </div>
                <div class="block-info">
                    <div class="info-item">
                        <div class="info-label">Timestamp</div>
                        <div class="info-value">${formatDate(block.timestamp)}</div>
                    </div>
                    <div class="info-item">
                        <div class="info-label">Nonce</div>
                        <div class="info-value">${block.nonce}</div>
                    </div>
                    <div class="info-item">
                        <div class="info-label">Transaction Count</div>
                        <div class="info-value">${block.data.transaction_count || 0}</div>
                    </div>
                </div>
                ${transactionsHTML}
                <div class="hash-section">
                    <div class="hash-label">Block Hash</div>
                    <div class="hash-value">${block.hash}</div>
                </div>
                <div class="hash-section">
                    <div class="hash-label">Previous Hash</div>
                    <div class="hash-value">${block.previous_hash}</div>
                </div>
            `;
            
            return blockDiv;
        }

        function formatTransactionType(type) {
            const typeMap = {
                'loan_application': 'Loan Application',
                'loan_approval': 'Loan Approval',
                'payment': 'Payment',
                'genesis': 'Genesis'
            };
            return typeMap[type] || type;
        }

        function formatTransactionDetails(tx) {
            let details = [];
            
            if (tx.customer_id) {
                details.push(`<div class="transaction-detail">👤 Customer: ${tx.customer_id}</div>`);
            }
            if (tx.loan_amount) {
                details.push(`<div class="transaction-detail">💰 Amount: $${tx.loan_amount.toLocaleString()}</div>`);
            }
            if (tx.loan_purpose) {
                details.push(`<div class="transaction-detail">📋 Purpose: ${tx.loan_purpose}</div>`);
            }
            if (tx.status) {
                details.push(`<div class="transaction-detail">📊 Status: ${tx.status}</div>`);
            }
            if (tx.loan_id) {
                details.push(`<div class="transaction-detail">🆔 Loan ID: ${tx.loan_id}</div>`);
            }
            if (tx.approved !== undefined) {
                details.push(`<div class="transaction-detail">✅ Approved: ${tx.approved ? 'Yes' : 'No'}</div>`);
            }
            if (tx.reason) {
                details.push(`<div class="transaction-detail">📝 Reason: ${tx.reason}</div>`);
            }
            if (tx.amount) {
                details.push(`<div class="transaction-detail">💳 Payment: $${tx.amount.toLocaleString()}</div>`);
            }
            if (tx.payment_type) {
                details.push(`<div class="transaction-detail">🏦 Type: ${tx.payment_type}</div>`);
            }
            if (tx.timestamp) {
                details.push(`<div class="transaction-detail">⏰ ${formatDate(tx.timestamp)}</div>`);
            }
            
            return details.join('');
        }

        function formatDate(timestamp) {
            const date = new Date(timestamp);
            return date.toLocaleString('en-US', {
                year: 'numeric',
                month: 'short',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            });
        }

        function refreshBlockchain() {
            document.getElementById('blockchainContent').innerHTML = 
                '<div class="loading">Refreshing blockchain...</div>';
            loadBlockchainStats();
            loadBlockchain();
        }

        // Initial load
        window.addEventListener('load', () => {
            loadBlockchainStats();
            loadBlockchain();
        });

        // Auto-refresh every 30 seconds
        setInterval(() => {
            loadBlockchainStats();
            loadBlockchain();
        }, 30000);
    </script>
</body>
</html>
